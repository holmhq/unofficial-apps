<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kalendar</title>
  <meta name="description" content="Share one link and let people book time with you. No sign-up for them, a calendar invite for both of you.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kalendar">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" href="/assets/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/src/styles.css">
  <link rel="modulepreload" href="/src/main.js">
  <link rel="modulepreload" href="/src/shell.js">
  <link rel="modulepreload" href="/src/ui.js">
  <link rel="modulepreload" href="/src/icons.js">
  <link rel="modulepreload" href="/src/api.js">
  <link rel="modulepreload" href="/src/store.js">
  <link rel="modulepreload" href="/src/theme.js">
  <link rel="modulepreload" href="/src/sound.js">
  <link rel="modulepreload" href="/src/time.js">
  <script>
    // Apply the saved theme and the colour this page last wore (theme.js)
    // before the first paint, and ask for this page's data now, while the
    // code loads (api.js picks the answers up).
    (function () {
      var mode = 'system', accent = null, path = location.pathname, m
      try {
        mode = localStorage.getItem('kalendar:theme') || 'system'
        var scope = (m = /^\/@([^/]+)/.exec(path)) ? '@' + decodeURIComponent(m[1]).toLowerCase()
          : (m = /^\/b\/([a-z0-9-]+)/.exec(path)) ? 'b:' + m[1]
          : /^\/(events|hours|insights|profile)?$/.test(path) ? 'me' : null
        if (scope) accent = localStorage.getItem('kalendar:accent:' + scope)
      } catch (e) {}
      var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
      if (dark) document.documentElement.classList.add('dark')
      if (accent) document.documentElement.setAttribute('data-accent', accent)
      document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#000000' : '#f5f5f7')
      var boot = window.__kalendarBoot = {}
      var ask = function (path) { boot[path] = fetch(path, { headers: { accept: 'application/json' } }); boot[path].catch(function () {}) }
      ask('/api/me?next=' + encodeURIComponent(path + location.search))
      if ((m = /^\/@([^/]+)\/([^/]+)\/?$/.exec(path))) ask('/api/u/' + m[1] + '/' + m[2])
      else if ((m = /^\/@([^/]+)\/?$/.exec(path))) ask('/api/u/' + m[1])
    })()
  </script>
</head>
<body>
  <div id="root"><div class="boot" aria-label="Loading"><span class="mark"><svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.5 4h11a4 4 0 0 1 4 4v9.5a4 4 0 0 1-4 4h-11a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4Zm0 6.5a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5a2 2 0 0 0-2-2ZM7.3 1.5a1.3 1.3 0 0 1 1.3 1.3v1.9a1.3 1.3 0 0 1-2.6 0V2.8a1.3 1.3 0 0 1 1.3-1.3Zm9.4 0A1.3 1.3 0 0 1 18 2.8v1.9a1.3 1.3 0 0 1-2.6 0V2.8a1.3 1.3 0 0 1 1.3-1.3Zm-1.2 11.4a2.1 2.1 0 1 1 0 4.2 2.1 2.1 0 0 1 0-4.2Z"/></svg></span></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
