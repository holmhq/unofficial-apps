<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found — Deck</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; --canvas: #ecedf0; --panel: #fff; --text: #161a22; --text-2: #4c5462; --accent: #2f5bd8; }
    @media (prefers-color-scheme: dark) { :root { --canvas: #0e1013; --panel: #16181c; --text: #e8eaee; --text-2: #a3a8b3; --accent: #9db6ff; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box;
      background: var(--canvas); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif; }
    .card { width: min(440px, 100%); padding: 26px 28px 28px; border-radius: 14px; background: var(--panel);
      box-shadow: 0 0 0 1px rgba(18, 26, 42, .07), 0 10px 28px -12px rgba(18, 26, 42, .16); }
    h1 { margin: 0; font-size: 21px; letter-spacing: -0.02em; }
    p { margin: 8px 0 0; color: var(--text-2); }
    a { color: var(--accent); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Nothing at this address</h1>
    <p>The link may be mistyped. <a href="/">Go to Deck</a></p>
  </div>
</body>
</html>
