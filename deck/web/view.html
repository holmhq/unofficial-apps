<!doctype html>
<html lang="en" data-accent="cobalt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Deck</title>
  <meta name="description" content="A deck, shared by link.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ecedf0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/inter-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/src/theme.js"></script>
  <link rel="stylesheet" href="/deck/deck.css?v=0.1.1">
  <link rel="stylesheet" href="/src/view.css?v=0.1.1">
  <script type="module" src="/src/view.js?v=0.1.1"></script>
</head>
<body>
  <div id="progress" aria-hidden="true"><i></i></div>
  <main id="deck" class="deck"></main>
  <aside id="notes" class="notes" aria-label="Speaker notes" hidden></aside>
  <nav id="controls" class="controls" aria-label="Slide controls" hidden></nav>
  <noscript><p class="noscript">This deck needs JavaScript to show its slides.</p></noscript>
</body>
</html>
