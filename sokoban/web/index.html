<!doctype html>
<html lang="en" data-theme="system" data-palette="bloom">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sokoban</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f3f7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sokoban">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="/src/styles.css">
  <script>
    // Apply the saved look before the first paint.
    (function () {
      var accents = { bloom: '#b197dc', mist: '#8fb0cc', sage: '#8fb5a0', soda: '#bf9ad6', mono: '#b0aeb8' }
      var mode = 'system', palette = 'bloom'
      try {
        mode = localStorage.getItem('sokoban:theme') || 'system'
        palette = localStorage.getItem('sokoban:palette') || 'bloom'
      } catch (e) {}
      if (!accents[palette]) palette = 'bloom'
      var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
      var root = document.documentElement
      root.setAttribute('data-theme', mode)
      root.setAttribute('data-palette', palette)
      root.style.setProperty('--accent', accents[palette])
      document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#101014' : '#f4f3f7')
    })()
  </script>
</head>
<body>
  <div class="app" id="app">
