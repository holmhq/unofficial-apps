<script>
  // Before the first paint: the saved theme, so nothing flashes, and the first answers the
  // page will need, asked for while its code loads.
  (function () {
    var saved = null, me = null, v = 0;
    try {
      saved = localStorage.getItem('shelf:theme');
      me = JSON.parse(localStorage.getItem('shelf:me') || 'null');
      if (me && me.id) v = (JSON.parse(localStorage.getItem('shelf:lib:' + me.id) || 'null') || {}).v || 0;
    } catch (e) {}
    var dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    var get = function (u) { return fetch(u, { credentials: 'same-origin', headers: { accept: 'application/json' } }).then(function (r) { return r.json(); }); };
    window.__shelf = {
      me: get('/api/me?return=' + encodeURIComponent(location.pathname + location.search)),
      library: me && me.signed_in ? get('/api/library' + (v ? '?v=' + v : '')) : null
    };
    window.__shelf.me.catch(function () {});
    if (window.__shelf.library) window.__shelf.library.catch(function () {});
  })();
</script>
