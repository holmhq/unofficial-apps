<script>
  // The saved theme before the first paint, so nothing flashes.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('domains:theme'); } catch (e) {}
    var dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
