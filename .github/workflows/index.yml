# index.json must list every app folder with its current fingerprint, and a
# released version's files must never change. On main, each new version is
# tagged <app>/v<version>.
name: index

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/index.mjs --check

  tag:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name "The Holm Authors"
          git config user.email "authors@holmhq.com"
          node scripts/index.mjs --tag
          git push --tags
