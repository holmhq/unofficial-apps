<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ralk — your agents, out loud</title>
<meta name="description" content="Claude Code tells this tab when a build finished, when it needs you, or when something broke: a chime, Olivia's voice, and a browser notification.">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ralk">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/src/styles.css?v=0.1.0">
<link rel="modulepreload" href="/src/main.js?v=0.1.0">
<script>
  // The saved theme before the first paint, so nothing flashes.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('ralk:theme'); } catch (e) {}
    var dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
</head>
<body>
<div id="root"><div class="boot"><svg class="i mark" width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="1.5" y="8" width="3" height="8" rx="1.5"/><rect x="6.375" y="4.5" width="3" height="15" rx="1.5"/><rect x="11.25" y="1" width="3" height="22" rx="1.5"/><rect x="16.125" y="4.5" width="3" height="15" rx="1.5"/><rect x="21" y="8" width="3" height="8" rx="1.5"/></svg></div></div>
<noscript><p style="text-align:center;margin-top:30vh;font-family:system-ui">Ralk needs JavaScript.</p></noscript>
<script type="module" src="/src/main.js?v=0.1.0"></script>
</body>
</html>
