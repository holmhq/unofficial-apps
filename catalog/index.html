<!doctype html>
<html lang="en">
<head>

  <meta name="theme-color" content="#f2f5f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1a1e" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/bricolage-grotesque-opsz.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">

  <main id="main" tabindex="-1">

    <p>Every app here installs from <a href="https://github.com/holmhq/unofficial-apps" rel="noopener" target="_blank">github.com/holmhq/unofficial-apps</a>

  <dialog class="sheet" id="install" aria-labelledby="install-title"></dialog>

  <script type="module" src="/src/app.js"></script>

</html>
