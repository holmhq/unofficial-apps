<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zend</title>
  <meta name="description" content="Text from your own Android phone, in a browser or from your scripts.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f9f9fb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Zend">
  <meta name="format-detection" content="telephone=no">
  <link rel="preload" href="/assets/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/src/styles.css">
  <script>
    // Apply the saved theme before the first paint.
    (function () {
      var mode = 'system'
      try { mode = localStorage.getItem('zend:theme') || 'system' } catch (e) {}
      var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
      if (dark) document.documentElement.classList.add('dark')
      document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#000000' : '#f9f9fb')
    })()
  </script>
</head>

</html>
