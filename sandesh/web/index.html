<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sandesh</title>
  <meta name="description" content="Send texts from your own Android phone, in a browser or from your scripts, with India's SMS rules built in.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#e8eef6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sandesh">
  <meta name="format-detection" content="telephone=no">
  <link rel="preload" href="/assets/fonts/anek-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/src/styles.css">
  <script>
    // Apply the saved theme before the first paint.
    (function () {
      var mode = 'system'
      try { mode = localStorage.getItem('sandesh:theme') || 'system' } catch (e) {}
      var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
      var root = document.documentElement
      root.setAttribute('data-theme', mode)
      if (dark) root.classList.add('is-dark')
      document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0e1524' : '#e8eef6')
    })()
  </script>
</head>
<body>
  <div class="app">
    <header class="top" id="top"></header>
    <div class="body">
      <nav class="tabs" id="tabs" aria-label="Sections" hidden></nav>
      <main class="main" id="main"><div class="loading"><div class="spinner"></div></div></main>
    </div>
  </div>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
